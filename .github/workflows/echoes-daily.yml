name: Echoes Daily

# 07:02 IST. Deliberately off the top of the hour: GitHub's shared runner
# fleet is most contended on the hour, and scheduled runs are best-effort -
# delays of several minutes are routine, and longer delays (even a few hours)
# are possible, since GitHub does not guarantee schedule timing. A late run
# is harmless here regardless - the playlist is calendar-keyed, so a delayed
# run still reads the correct day.
#
# The Sunday refresh is not a separate schedule. It runs inside this same job,
# after delivery, so a refresh failure can never stop the day's quotes.
on:
  schedule:
    - cron: "2 3 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending or writing state"
        type: boolean
        default: false
      log_level:
        description: "Log level"
        type: choice
        options: [INFO, DEBUG, WARNING, ERROR]
        default: INFO

# Needed to commit the updated playlist back to the repository.
permissions:
  contents: write

# Never let a manual run and a scheduled run write state at the same time.
concurrency:
  group: echoes-daily
  cancel-in-progress: false

jobs:
  deliver:
    name: Prepare, deliver, refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install, not `pip install .` - config.py's project_root()
          # locates the repo by walking up from its own file location, which
          # only resolves correctly when that file lives in the actual
          # checkout (editable install) rather than a copy under
          # site-packages (regular install). A non-editable install here
          # silently wrote state/ to a throwaway path outside the repo,
          # which is why nothing ever got committed back.
          pip install --editable .

      - name: Run Echoes
        env:
          # Secrets. Add these under
          # Settings -> Secrets and variables -> Actions.
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_BOOKS_DATABASE_ID: ${{ secrets.NOTION_BOOKS_DATABASE_ID }}
          NOTION_ME_SECTION_DATABASE_ID: ${{ secrets.NOTION_ME_SECTION_DATABASE_ID }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO_ADDRESS: ${{ secrets.EMAIL_TO_ADDRESS }}

          # Non-secret configuration. Add these under the "Variables" tab, or
          # leave them unset to use the defaults compiled into config.py.
          NOTION_BOOKS_COMPLETED_ON_OR_AFTER: ${{ vars.NOTION_BOOKS_COMPLETED_ON_OR_AFTER || '2024-04-24' }}
          NOTION_BOOKS_STATUS_VALUE: ${{ vars.NOTION_BOOKS_STATUS_VALUE || 'Completed' }}
          NOTION_ME_SECTION_TAG_VALUE: ${{ vars.NOTION_ME_SECTION_TAG_VALUE || 'Quote' }}
          QUOTES_PER_DAY_BOOKS: ${{ vars.QUOTES_PER_DAY_BOOKS || '2' }}
          QUOTES_PER_DAY_STANDALONE: ${{ vars.QUOTES_PER_DAY_STANDALONE || '1' }}
          QUOTES_PER_DAY_BOOKS_FALLBACK: ${{ vars.QUOTES_PER_DAY_BOOKS_FALLBACK || '3' }}
          # EMAIL_SUBJECT must stay identical across every run, forever, once
          # email sends start - changing it starts a new Gmail thread.
          EMAIL_SUBJECT: ${{ vars.EMAIL_SUBJECT || 'Echoes — Daily Quotes' }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}

          # Defaults to 'email'. Requires EMAIL_FROM_ADDRESS/EMAIL_APP_PASSWORD/
          # EMAIL_TO_ADDRESS secrets to be set - override to 'console' here (or
          # via the Variables tab) if those aren't configured yet.
          DELIVERY_MODE: ${{ vars.DELIVERY_MODE || 'email' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          LOG_LEVEL: ${{ inputs.log_level || vars.LOG_LEVEL || 'INFO' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: echoes run

      - name: Commit updated playlist
        # Runs even when delivery failed: a rebuilt playlist that was written
        # to disk should still be preserved.
        if: always()
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore(echoes): update playlist state for $(date -u +%Y-%m-%d)"
          # Rebase in case a manual run pushed in the meantime.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
