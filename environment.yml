# Conda environment for Echoes.
#
#   conda env create -f environment.yml
#   conda activate echoes
#
# Or use ./setup_env.sh, which also installs the package in editable mode.
name: echoes

channels:
  - conda-forge

dependencies:
  - python=3.13
  - pip>=24.0

  # Runtime
  - requests>=2.32
  - python-dotenv>=1.0

  # Development
  - pytest>=8.0
  - pytest-cov>=5.0
  - ruff>=0.6

  - pip:
      # Not packaged on conda-forge; used to stub HTTP in tests.
      - responses>=0.25
